<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몰입형 XR 프로젝트 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECEEF5; --surface:#FFFFFF; --ink:#171A2F; --muted:#5A6079; --line:#D5D9E7;
  --accent:#4A2FD4; --on-accent:#FFFFFF; --accent-soft:#E7E2FF;
  --ok:#0D8A73; --ok-soft:#DCF4EE; --warn:#9A5F00; --warn-soft:#FFF0D2; --err:#B3261E;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10122A; --surface:#1A1D3B; --ink:#ECEDF8; --muted:#A3A7C5; --line:#2D315A;
    --accent:#9384FF; --on-accent:#0F1030; --accent-soft:#2A2563;
    --ok:#46D3B3; --ok-soft:#123935; --warn:#F2B64A; --warn-soft:#3A2E12; --err:#FF8A80;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* ---------- 홈 ---------- */
.home{max-width:980px;margin:0 auto;padding:56px 24px 64px}
.org{margin:0 0 14px;color:var(--muted);font-weight:500}
.course{font-family:var(--display);font-weight:400;font-size:clamp(3rem,10vw,6.2rem);line-height:.98;letter-spacing:-.01em}
.term{margin:18px 0 44px;font-size:1.125rem;color:var(--muted)}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}
.stages::before{content:"";position:absolute;left:8%;right:8%;top:64px;border-top:2px dashed var(--line);z-index:0}
.stage{position:relative;z-index:1;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:2px;min-height:210px}
.stage .rn{font-family:var(--display);font-size:5.2rem;line-height:1;color:var(--line);margin-bottom:auto}
.stage .st{font-weight:700;font-size:1.15rem;margin-top:14px}
.stage .ss{font-size:.9rem;color:var(--muted)}
.stage.is-open{border-color:var(--accent);box-shadow:0 10px 0 -2px var(--accent)}
.stage.is-open .rn{color:var(--accent)}
.stage.is-open .ss{color:var(--accent);font-weight:600}
.stage.is-open:hover{transform:translateY(-2px)}
.stage.is-soon{border-style:dashed;background:var(--bg);cursor:default}
.setup-note{margin-top:36px;padding:14px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.95rem}
@media (max-width:720px){
  .home{padding-top:36px}
  .stages{grid-template-columns:1fr}
  .stages::before{left:52px;right:auto;top:20px;bottom:20px;border-top:0;border-left:2px dashed var(--line)}
  .stage{flex-direction:row;align-items:center;gap:18px;min-height:0;padding:16px 18px}
  .stage .rn{font-size:3rem;margin:0;min-width:64px;text-align:center}
  .stage .st{margin:0}
  .stage .txt{display:flex;flex-direction:column}
}
@media (min-width:721px){ .stage .txt{display:contents} }

/* ---------- 공통 상단 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.back{border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600}
.back:hover{background:var(--surface);color:var(--ink)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bt .crumb{font-size:.8rem;color:var(--muted)}
.bt strong{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.page{max-width:760px;margin:0 auto;padding:28px 18px 80px}
.page.wide{max-width:1180px}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn.big{padding:14px 22px;font-size:1.05rem}
.btn.block{width:100%;padding:15px;font-size:1.05rem;margin-top:28px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- 허브 ---------- */
.hubhead{display:flex;align-items:center;gap:20px;margin-bottom:28px}
.hubhead .rn{font-family:var(--display);font-size:4.6rem;line-height:1;color:var(--accent)}
.hubhead h1{font-family:var(--display);font-weight:400;font-size:2.1rem}
.hubhead p{margin:4px 0 0;color:var(--muted)}
.roles{display:grid;gap:12px}
.role{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center}
.role strong{font-size:1.15rem}
.role span{grid-column:1;color:var(--muted);font-size:.95rem}
.role::after{content:"›";grid-column:2;grid-row:1 / span 2;font-size:1.8rem;color:var(--muted)}
.role:hover{border-color:var(--accent)}
.role.admin{background:transparent;border-style:dashed}
.weights{margin-top:24px;font-size:.92rem;color:var(--muted)}

/* ---------- 이름 선택 ---------- */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:20px}
.name{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 12px;font-weight:600;text-align:center;word-break:keep-all}
.name:hover{border-color:var(--accent);color:var(--accent)}
.page h2{font-family:var(--display);font-weight:400;font-size:1.7rem}

/* ---------- 상호평가 목록 ---------- */
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:1.05rem}
.progress{margin:18px 0 24px}
.progress .track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .track span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.progress p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.roster{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.roster li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center}
.roster li.done{border-color:var(--ok)}
.roster .nm{font-weight:700;font-size:1.05rem;word-break:keep-all}
.roster .meta{grid-column:1 / -1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (min-width:600px){
  .roster li{grid-template-columns:minmax(140px,1fr) auto auto auto}
  .roster .meta{display:contents}
}
.play{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);text-decoration:none;padding:6px 12px;border-radius:99px;background:var(--accent-soft);font-size:.92rem}
.play::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.play.off{background:transparent;color:var(--muted);font-weight:500;padding-left:0}
.play.off::before{display:none}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--line);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- 평가 폼 ---------- */
.target{margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px}
.target p{margin:0;font-size:.9rem}
.target h2{font-size:2rem}
.note{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.93rem}
.q{border:0;margin:0;padding:22px 0;border-bottom:1px solid var(--line)}
.q legend{float:left;width:100%;display:flex;gap:12px;font-weight:600;font-size:1.05rem;padding:0;margin-bottom:14px}
.q .scale{clear:both}
.q .qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.9rem;font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px}
.dot{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1.15rem}
.dot:hover{border-color:var(--accent)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ends{display:flex;justify-content:space-between;max-width:440px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:6px;padding:16px 0;color:var(--muted)}
.total b{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--ink)}
.sub{margin:22px 0 4px;font-size:1.05rem}
.sub small{color:var(--muted);font-weight:500}
.ta{display:block;margin-top:14px}
.ta span{display:block;font-weight:600;margin-bottom:6px}
textarea,input[type=text],input[type=url],input[type=password],input[type=number],select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--accent);outline:none}

/* ---------- 로그인 ---------- */
.login{max-width:380px;margin:40px auto 0;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:26px}
.login h2{margin-bottom:6px}
.login label{display:block;margin:18px 0 6px;font-weight:600}
.login .btn{width:100%;margin-top:14px;padding:12px}

/* ---------- 교수 화면 ---------- */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px}
.stat b{font-size:1.35rem}
.stat span{display:block;font-size:.85rem;color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tools select{width:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.82rem;background:var(--bg)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--bg)}
tr:last-child td{border-bottom:0}
td.final{font-weight:700;font-size:1.02rem;color:var(--accent)}
td.left{text-align:left;white-space:normal}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
.dash{color:var(--muted)}

.profgrid{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media (max-width:800px){.profgrid{grid-template-columns:1fr}}
.plist{display:grid;gap:6px}
@media (max-width:800px){.plist{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;word-break:keep-all}
.pitem[aria-current=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pitem small{font-weight:600;color:var(--ok)}
.pform{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px}
.pform h3{font-family:var(--display);font-weight:400;font-size:1.7rem;margin-bottom:4px}
.prow{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow label{font-weight:600}
.prow label small{display:block;color:var(--muted);font-weight:500}
.prow input{text-align:right;font-weight:700;font-size:1.05rem}
.prow input.bad{border-color:var(--err)}
.pactions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}

.urlrow{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.urlrow strong{word-break:keep-all}
@media (max-width:640px){.urlrow{grid-template-columns:1fr auto}.urlrow input{grid-column:1 / -1;grid-row:2}}

/* ---------- 상세 모달 ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,30,.55);display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 40px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.drawer h2{font-family:var(--display);font-weight:400;font-size:2rem}
.drawer section{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.drawer h4{margin:0 0 10px;font-size:1rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.93rem}
.kv span:nth-child(even){font-weight:700;text-align:right}
.cmt{border-top:1px solid var(--line);padding:10px 0;font-size:.93rem}
.cmt:first-of-type{border-top:0}
.cmt b{display:block;font-size:.85rem;color:var(--muted)}
.cmt p{margin:2px 0;white-space:pre-wrap}

/* ---------- 알림 ---------- */
#busy{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(10,12,30,.25)}
#busy.on{display:grid}
#busy div{background:var(--surface);border-radius:14px;padding:16px 22px;font-weight:600;display:flex;gap:12px;align-items:center}
#busy i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);z-index:50;opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--err);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="busy" role="status" aria-live="polite"><div><i></i><span>불러오는 중</span></div></div>
<div id="toast" role="alert"></div>

<script>
/* =========================================================
   설정: Apps Script 웹 앱 배포 후 받은 URL을 아래에 붙여 넣으세요.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbzfUkP90LsFPeCkCoWH_I25bzJPmTXae81TCCJv8vf_xH7pOI8tv1vU8xvCxKT73JaT/exec';

const COURSE = { title: '몰입형 XR 프로젝트', term: '2026학년도 2학기 프로젝트 평가', org: '신라대학교 컴퓨터공학과' };

const PROJECTS = [
  { id: 'p1', roman: 'I', title: '게임 프로젝트 I', open: true, rubric: {
      prof: [
        { label: '게임 완성도 및 재미', max: 25 },
        { label: '이미지·사운드 완성도', max: 20 },
        { label: '생성형 AI 활용 과정', max: 25 },
        { label: '기획서-결과물 일치도', max: 10 },
        { label: '배포 및 실행 가능성', max: 10 },
        { label: '발표력', max: 10 }
      ],
      peer: [
        '이 게임은 실제로 재미있었다',
        '이미지와 사운드가 게임 분위기와 잘 어울렸다',
        '생성형 AI를 어떻게 활용했는지 설명이 흥미롭고 이해하기 쉬웠다',
        '시연이 매끄러웠고 게임이 안정적으로 작동했다',
        '기회가 된다면 이 게임을 다시 플레이해보고 싶다'
      ],
      peerText: ['가장 인상 깊었던 부분', '개선하면 더 좋을 것 같은 점'],
      selfScale: [
        '내가 기획한 핵심 재미(Core Fun)를 실제로 구현해냈다',
        '이미지·사운드를 목표한 수준으로 완성했다',
        'AI가 제안한 결과를 그대로 쓰지 않고 검증·수정하며 활용했다',
        '3주 일정 안에 계획했던 기능을 대부분 구현했다',
        '배포 후 다른 사람이 문제없이 플레이할 수 있는 상태로 완성했다'
      ],
      selfText: [
        '이번 프로젝트에서 가장 잘했다고 생각하는 부분은?',
        '가장 아쉬웠던 점과 그 이유는? (시간 부족, 기술적 어려움, 기획 미흡 등)',
        'AI 활용 중 가장 도움이 되었던 프롬프트나 전략은 무엇인가?',
        '다음 프로젝트(프로젝트 II)에서 다르게 시도해보고 싶은 것은?'
      ],
      profMax: 100, peerMax: 25, selfMax: 25,
      weights: { prof: 0.7, peer: 0.2, self: 0.1 }
  }},
  { id: 'p2', roman: 'II', title: '프로젝트 II', open: false },
  { id: 'p3', roman: 'III', title: '프로젝트 III', open: false }
];

/* ---------- 상태 ---------- */
const store = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); } catch(e){} }
};
const S = {
  view: 'home', project: null, mode: null,
  students: [], me: store.get('xr_me'), sid: store.get('xr_sid'), pick: null, status: null, target: null,
  form: null, pw: store.get('xr_pw'), admin: null, tab: 'result', sort: 'name',
  pform: null, urlDraft: null, detail: null
};
const proj = () => PROJECTS.find(p => p.id === S.project);
const $app = document.getElementById('app');

/* ---------- 유틸 ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const safeUrl = u => /^https?:\/\/\S+$/i.test(u || '');
const r2 = x => Math.round(x * 100) / 100;
const fmt = x => x == null ? '<span class="dash">-</span>' : r2(x).toString();
let toastTimer;
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on' + (type === 'err' ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 3200);
}
function busy(on){ document.getElementById('busy').classList.toggle('on', on); }
async function withBusy(fn){
  busy(true);
  try { await fn(); return true; }
  catch(e){ toast(e.message || '요청을 처리하지 못했습니다.', 'err'); return false; }
  finally { busy(false); }
}
const apiReady = () => API_URL && !API_URL.startsWith('PASTE_');
async function api(action, payload){
  if (!apiReady()) throw new Error('서버 주소가 설정되지 않았습니다. index.html의 API_URL을 입력하세요.');
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, project: S.project }, payload || {})) });
  } catch(e){ throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.'); }
  const data = await res.json().catch(() => ({ ok: false, error: '서버 응답을 읽지 못했습니다.' }));
  if (!data.ok) throw new Error(data.error || '요청을 처리하지 못했습니다.');
  return data;
}

/* ---------- 집계 ---------- */
function compute(){
  const R = proj().rubric, D = S.admin, W = R.weights;
  return D.students.map(s => {
    const pr = D.prof.find(x => x.name === s.name);
    const peers = D.peer.filter(x => x.target === s.name);
    const sf = D.self.find(x => x.name === s.name);
    const profT = pr ? pr.total : null;
    const peerAvg = peers.length ? peers.reduce((a, x) => a + x.total, 0) / peers.length : null;
    const selfT = sf ? sf.total : null;
    const cP = (profT || 0) / R.profMax * 100 * W.prof;
    const cQ = (peerAvg || 0) / R.peerMax * 100 * W.peer;
    const cS = (selfT || 0) / R.selfMax * 100 * W.self;
    const missing = [profT == null && '교수', peerAvg == null && '상호', selfT == null && '자기'].filter(Boolean);
    return { name: s.name, sid: s.sid || '', url: s.url, pr, peers, sf, profT, peerAvg, peerN: peers.length, selfT, cP, cQ, cS, final: cP + cQ + cS, missing };
  });
}

  const D = S.admin, n = D.students.length;
  return `<div class="tablewrap"><table>
    <thead><tr><th>이름</th><th>상호평가 제출</th><th>받은 상호평가</th><th>자기평가</th><th style="text-align:left">아직 평가하지 않은 대상</th></tr></thead>
    <tbody>${D.students.map(s => {
      const given = D.peer.filter(p => p.evaluator === s.name).map(p => p.target);
      const recv = D.peer.filter(p => p.target === s.name).length;
      const left = D.students.filter(o => o.name !== s.name && !given.includes(o.name)).map(o => o.name);
      const selfOk = D.self.some(x => x.name === s.name);
      return `<tr><td><strong>${esc(s.name)}</strong></td>
        <td><span class="chip ${given.length === n - 1 ? 'ok' : ''}">${given.length} / ${n - 1}</span></td>
        <td>${recv}명</td><td>${selfOk ? '<span class="chip ok">제출</span>' : '<span class="chip warn">미제출</span>'}</td>
        <td class="left">${left.length ? esc(left.join(', ')) : '<span class="dash">없음</span>'}</td></tr>`; }).join('')}</tbody>
  </table></div>`;
}

/* ---------- 엑셀 다운로드 ---------- */
function downloadXlsx(){
  if (typeof XLSX === 'undefined') return toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.', 'err');
  const R = proj().rubric, D = S.admin, rows = compute();
  const wb = XLSX.utils.book_new();
  const add = (aoa, name, widths) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  const nz = x => x == null ? '' : r2(x);

  add([['학번','이름','교수 평가(100)','상호평가 평균(25)','상호평가 인원','자기평가(25)','교수 반영(70%)','상호 반영(20%)','자기 반영(10%)','최종 점수(100)','누락','배포 주소']]
    .concat(rows.map(r => [r.sid, r.name, nz(r.profT), nz(r.peerAvg), r.peerN, nz(r.selfT), r2(r.cP), r2(r.cQ), r2(r.cS), r2(r.final), r.missing.join(', '), r.url])),
    '최종결과', [12,22,14,16,12,13,14,14,14,14,14,40]);

  add([['이름'].concat(R.prof.map(p => `${p.label}(${p.max})`), ['합계(100)','코멘트','수정일시'])]
    .concat(D.students.map(s => { const p = D.prof.find(x => x.name === s.name); return p ? [s.name].concat(p.scores, [p.total, p.comment, p.time]) : [s.name]; })),
    '교수평가', [22].concat(R.prof.map(() => 16), [11, 40, 20]));

  add([['평가자','피평가자'].concat(R.peer.map((q, i) => `${i + 1}. ${q}`), ['합계(25)', R.peerText[0], R.peerText[1], '제출일시'])]
    .concat(D.peer.map(p => [p.evaluator, p.target].concat(p.scores, [p.total, p.good, p.improve, p.time]))),
    '상호평가', [18,18].concat(R.peer.map(() => 14), [10, 40, 40, 20]));

  add([['이름'].concat(R.selfScale.map((q, i) => `A${i + 1}. ${q}`), ['합계(25)'], R.selfText.map((q, i) => `B${i + 1}. ${q}`), ['제출일시'])]
    .concat(D.students.map(s => { const x = D.self.find(v => v.name === s.name); return x ? [s.name].concat(x.scores, [x.total], x.texts, [x.time]) : [s.name]; })),
    '자기평가', [22].concat(R.selfScale.map(() => 14), [10], R.selfText.map(() => 45), [20]));

  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  XLSX.writeFile(wb, `몰입형XR_${proj().title.replace(/\s/g, '')}_평가결과_${ymd}.xlsx`);
}

/* ---------- 흐름 ---------- */
async function loadRoster(){ const d = await api('roster'); S.students = d.students; }
async function loadAdmin(){ const d = await api('adminData', { password: S.pw }); S.admin = d.data; }

async function enterStudent(mode){
  S.mode = mode;
  const ok = await withBusy(loadRoster);
  if (!ok) return;
  if (!S.me || !S.sid || !S.students.some(s => s.name === S.me)) return go('who');
  afterMe();
}
function setStudent(name, sid){
  S.me = name; S.sid = sid;
  store.set('xr_me', name); store.set('xr_sid', sid);
}
async function afterMe(){
  const ok = await withBusy(async () => { const d = await api('myStatus', { name: S.me, sid: S.sid }); S.status = d.status; });
  if (!ok){ setStudent(null, null); return go('who'); }
  if (S.mode === 'peer') go('peerList');
  else { const R = proj().rubric; S.form = { scores: R.selfScale.map(() => 0), texts: R.selfText.map(() => '') }; go('selfForm'); }
}

function render(){
  const v = {
    home: vHome, hub: vHub, who: vWho, peerList: vPeerList, peerForm: vPeerForm,
    selfForm: vSelfForm, login: vLogin, admin: vAdmin, auth: vAuth
  }[S.view] || vHome;
  $app.innerHTML = v();
  if (S.view === 'login'){ const pw = document.getElementById('pw'); pw && pw.focus(); }
  if (S.view === 'auth'){ const el = document.getElementById('sid'); el && el.focus(); }
}

async function doStudentLogin(){
  const sid = document.getElementById('sid').value.trim();
  if (!sid) return toast('학번을 입력하세요.', 'err');
  let status = null;
  const ok = await withBusy(async () => { const d = await api('studentLogin', { name: S.pick, sid }); status = d.status; });
  if (!ok){ const el = document.getElementById('sid'); if (el){ el.value = ''; el.focus(); } return; }
  setStudent(S.pick, sid); S.status = status;
  if (S.mode === 'peer') go('peerList');
  else { const R = proj().rubric; S.form = { scores: R.selfScale.map(() => 0), texts: R.selfText.map(() => '') }; go('selfForm'); }
}

async function doLogin(){
  const pw = document.getElementById('pw').value;
  if (!pw) return toast('비밀번호를 입력하세요.', 'err');
  S.pw = pw;
  const ok = await withBusy(loadAdmin);
  if (ok){ store.set('xr_pw', pw); go('admin', { tab: 'result', pform: null, urlDraft: null, detail: null }); }
  else { S.pw = null; store.set('xr_pw', null); }
}

const actions = {
  async project(el){
    const p = PROJECTS.find(x => x.id === el.dataset.id);
    if (!p.open) return toast(`${p.title} 평가는 아직 열리지 않았습니다.`);
    go('hub', { project: p.id, students: [], status: null, admin: null, pform: null, urlDraft: null, detail: null });
  },
  back(el){ go(el.dataset.to, { detail: null }); },
  async role(el){
    const r = el.dataset.role;
    if (r === 'admin'){
      if (S.pw){
        const ok = await withBusy(loadAdmin);
        if (ok) return go('admin', { tab: 'result', pform: null, urlDraft: null });
        S.pw = null; store.set('xr_pw', null);
      }
      return go('login');
    }
    enterStudent(r);
  },
  me(el){ go('auth', { pick: el.dataset.name }); },
  'change-me'(){ setStudent(null, null); S.status = null; go('who'); },
  'student-login'(){ doStudentLogin(); },
  eval(el){
    const R = proj().rubric;
    go('peerForm', { target: el.dataset.name, form: { scores: R.peer.map(() => 0), texts: R.peerText.map(() => '') } });
  },
  rate(el){
    const i = +el.dataset.i, v = +el.dataset.v;
    S.form.scores[i] = v;
    el.parentElement.querySelectorAll('.dot').forEach(b => { const on = +b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    const s = document.getElementById('sum'); if (s) s.textContent = formSum();
  },
  async 'submit-peer'(){
    const miss = S.form.scores.findIndex(x => !x);
    if (miss >= 0) return toast(`${miss + 1}번 문항의 점수를 선택하세요.`, 'err');
    const ok = await withBusy(() => api('submitPeer', { evaluator: S.me, sid: S.sid, target: S.target, scores: S.form.scores, texts: S.form.texts }));
    if (!ok) return;
    if (!S.status.peerDone.includes(S.target)) S.status.peerDone.push(S.target);
    toast(`${S.target} 학생 평가를 제출했습니다.`);
    go('peerList');
  },
  async 'submit-self'(){
    const miss = S.form.scores.findIndex(x => !x);
    if (miss >= 0) return toast(`A-${miss + 1}번 문항의 점수를 선택하세요.`, 'err');
    const empty = S.form.texts.findIndex(t => t.trim().length < 10);
    if (empty >= 0) return toast(`B-${empty + 1}번 문항을 10자 이상 작성하세요.`, 'err');
    const ok = await withBusy(() => api('submitSelf', { name: S.me, sid: S.sid, scores: S.form.scores, texts: S.form.texts }));
    if (!ok) return;
    S.status.selfDone = true;
    toast('자기평가를 제출했습니다.');
    go('hub');
  },
  login(){ doLogin(); },
  logout(){ S.pw = null; S.admin = null; store.set('xr_pw', null); go('hub'); },
  tab(el){ S.tab = el.dataset.tab; S.detail = null; render(); },
  async refresh(){ const ok = await withBusy(loadAdmin); if (ok){ S.urlDraft = null; if (S.pform) selectProf(S.pform.name); render(); toast('최신 데이터를 불러왔습니다.'); } },
  download(){ downloadXlsx(); },
  detail(el){ S.detail = el.dataset.name; render(); },
  'close-detail'(el, ev){ if (ev.target.closest('[data-stop]') && !ev.target.closest('.btn')) return; S.detail = null; render(); },
  'prof-sel'(el){ selectProf(el.dataset.name); render(); },
  async 'save-prof'(el){
    const R = proj().rubric, f = S.pform;
    for (let i = 0; i < R.prof.length; i++){
      const x = Number(f.scores[i]);
      if (f.scores[i] === '' || !isFinite(x) || x < 0 || x > R.prof[i].max)
        return toast(`${R.prof[i].label}: 0~${R.prof[i].max} 사이로 입력하세요.`, 'err');
    }
    const ok = await withBusy(async () => { await api('saveProf', { password: S.pw, name: f.name, scores: f.scores.map(Number), comment: f.comment }); await loadAdmin(); });
    if (!ok) return;
    toast(`${f.name} 학생 교수 평가를 저장했습니다.`);
    if (el.dataset.next){
      const list = S.admin.students, idx = list.findIndex(s => s.name === f.name);
      if (idx < list.length - 1) selectProf(list[idx + 1].name);
      else selectProf(f.name);
    } else selectProf(f.name);
    render();
  },
  async 'save-urls'(){
    const bad = Object.entries(S.urlDraft).find(([, u]) => u.trim() && !safeUrl(u.trim()));
    if (bad) return toast(`${bad[0]}: 주소는 http:// 또는 https://로 시작해야 합니다.`, 'err');
    const urls = {}; Object.entries(S.urlDraft).forEach(([k, v]) => urls[k] = v.trim());
    const ok = await withBusy(async () => { await api('saveUrls', { password: S.pw, urls }); await loadAdmin(); });
    if (!ok) return;
    S.urlDraft = null; render(); toast('배포 주소를 저장했습니다.');
  }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || !$app.contains(el) && !el.closest('.overlay')) return;
  const fn = actions[el.dataset.act];
  if (fn){ fn(el, ev); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.t != null && S.form){ S.form.texts[+t.dataset.t] = t.value; }
  else if (t.dataset.pi != null && S.pform){
    S.pform.scores[+t.dataset.pi] = t.value;
    const max = +t.max, x = Number(t.value);
    t.classList.toggle('bad', t.value !== '' && (!isFinite(x) || x < 0 || x > max));
    const s = document.getElementById('psum'); if (s) s.textContent = r2(S.pform.scores.reduce((a, v) => a + (Number(v) || 0), 0));
  }
  else if (t.id === 'pcomment' && S.pform){ S.pform.comment = t.value; }
  else if (t.dataset.url != null && S.urlDraft){ S.urlDraft[t.dataset.url] = t.value; }
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.actChange === 'sort'){ S.sort = ev.target.value; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'pw') doLogin();
  if (ev.key === 'Enter' && ev.target.id === 'sid') doStudentLogin();
  if (ev.key === 'Escape' && S.detail){ S.detail = null; render(); }
});

render();
</script>
</body>
</html>
